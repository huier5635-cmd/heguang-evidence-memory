[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heguang-coding-memory"
version = "0.2.0.dev6+obs1"
description = "Independent coding-memory Add/Search development candidate"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
rerank = ["onnxruntime>=1.31,<2", "tokenizers>=0.23,<1", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["heguang_code*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
