services:
  memory:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - memory-data:/app/data
    stop_grace_period: 30m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
volumes:
  memory-data:

