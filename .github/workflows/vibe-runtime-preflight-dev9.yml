name: Public Vibe complete-history runtime preflight
on:
  push:
    branches: [coding-vibe-preflight-dev9]
permissions: {}
jobs:
  base-runtime-only:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        case: [neurodatawithoutborders__pynwb-998, pyccel__pyccel-2019, xgcm__xgcm-558]
    steps:
      - name: Fetch exact public validation commit without credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git init checkout
          cd checkout
          git remote add origin https://github.com/huier5635-cmd/heguang-evidence-memory.git
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
      - name: Verify base sources and Python runtime without running tests
        env:
          CASE_ID: ${{ matrix.case }}
        run: python3 checkout/research/vibe-runtime-dev9/host.py --case "$CASE_ID"
