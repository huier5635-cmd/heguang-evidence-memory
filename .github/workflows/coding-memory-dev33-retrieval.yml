name: Qianora dev33 independent public Add Search preparation
on:
  push:
    branches: [coding-memory-dev33-retrieval]
permissions: {}
jobs:
  independent-retrieval:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch exact public commit without credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git init checkout
          cd checkout
          git remote add origin https://github.com/huier5635-cmd/heguang-evidence-memory.git
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
      - name: Install pinned dependencies and acquire six pinned public model files
        run: |
          python3 -m venv "$RUNNER_TEMP/qianora-dev33-venv"
          PY="$RUNNER_TEMP/qianora-dev33-venv/bin/python"
          "$PY" -m pip install -r checkout/research/query-context-dev33/requirements.txt
          "$PY" checkout/research/query-context-dev33/download_model.py
      - name: Run actual Add Search and full original-message audits for both variants
        run: |
          "$RUNNER_TEMP/qianora-dev33-venv/bin/python" checkout/research/query-context-dev33/retrieve.py
