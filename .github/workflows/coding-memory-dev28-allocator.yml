name: Qianora dev28 allocator release capacity pair
on:
  push:
    branches: [coding-memory-dev28-allocator-pair]
permissions: {}
jobs:
  capacity:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch the exact public commit without credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git init checkout
          cd checkout
          git remote add origin https://github.com/huier5635-cmd/heguang-evidence-memory.git
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
      - name: Acquire pinned assets once and share identical files
        run: |
          python3 -m venv "$RUNNER_TEMP/qianora-capacity-venv"
          PY="$RUNNER_TEMP/qianora-capacity-venv/bin/python"
          PAIR=checkout/research/capacity-dev28-allocator
          "$PY" -m pip install -r "$PAIR/baseline/requirements.txt"
          "$PY" "$PAIR/baseline/download_assets.py"
          cp -al "$PAIR/baseline/inputs" "$PAIR/candidate/inputs"
          cp -al "$PAIR/baseline/model" "$PAIR/candidate/model"
      - name: Build one pinned image for both arms
        run: |
          docker pull python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
          BASE_IMAGE="$(docker image inspect python@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704 --format '{{index .RepoDigests 0}}')"
          docker build --build-arg "BASE_IMAGE=$BASE_IMAGE" -t qianora-capacity-dev28 checkout/research/capacity-dev28-allocator/baseline
          docker image inspect qianora-capacity-dev28 --format '{{.Id}}' > "$RUNNER_TEMP/qianora-capacity-image-id"
          echo "Base image: $BASE_IMAGE"
          cat "$RUNNER_TEMP/qianora-capacity-image-id"
          swapon --show --bytes
      - name: Execute both frozen arms once and preserve either failure
        run: |
          export QIANORA_CAPACITY_IMAGE="$(cat "$RUNNER_TEMP/qianora-capacity-image-id")"
          "$RUNNER_TEMP/qianora-capacity-venv/bin/python" checkout/research/capacity-dev28-allocator/pair_runner.py
