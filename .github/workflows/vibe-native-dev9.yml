name: Frozen reviewed public Vibe native evaluation
on:
  push:
    branches: [coding-vibe-native-dev9]
permissions: {}
jobs:
  native-reviewed:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: [neurodatawithoutborders__pynwb-998, pyccel__pyccel-2019, xgcm__xgcm-558]
    steps:
      - name: Fetch immutable public commit without credentials
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git init checkout
          cd checkout
          git remote add origin https://github.com/huier5635-cmd/heguang-evidence-memory.git
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
      - name: Run fixed offline native tests against frozen reviewed proposals
        env:
          CASE_ID: ${{ matrix.case }}
        run: python3 checkout/research/vibe-native-dev9/evaluate_native_linux.py --case "$CASE_ID" --output "$RUNNER_TEMP/qianora-native-$CASE_ID"
